<!DOCTYPE html>
<html lang="zh-TW" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>教育訓練與工安宣導 簽核平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }
    #modalSigCanvas { touch-action: none; }
    .sig-guide-line {
      background-image: linear-gradient(to bottom, transparent 85%, #f1f5f9 85%);
      background-size: 100% 40px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 flex justify-center items-start font-sans">

  <div class="w-full max-w-md my-2 space-y-4">
    
    <!-- 1. 學員登入視窗 -->
    <div id="studentLoginBox" class="bg-white rounded-2xl shadow-md p-6 text-center space-y-5">
      <div class="space-y-1">
        <span class="text-xs bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-full">現場無紙化</span>
        <h1 class="text-2xl font-bold text-slate-800 pt-2">同仁教育訓練簽核平台</h1>
        <p class="text-xs text-slate-500">輸入工號以查詢您尚未完成的宣導/訓練課程</p>
      </div>

      <div class="space-y-3">
        <input type="text" id="loginEmpId" placeholder="請輸入工號 (如 N000143451)" class="w-full border-2 border-slate-300 rounded-xl p-3 text-center text-base font-bold outline-none focus:border-blue-500">
        <button type="button" onclick="handleStudentLogin()" id="studentLoginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl text-base shadow transition">
          查詢我的待完成課程
        </button>
      </div>
    </div>

    <!-- 2. 學員待辦儀表板 -->
    <div id="studentPortal" class="hidden space-y-4">
      
      <!-- 個人頂部狀態列 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-slate-800"><span id="welcomeName">同仁</span>，您好</h2>
          <p class="text-xs text-slate-500">工號：<span id="displayEmpId">--</span> ｜ 訓練待辦中心</p>
        </div>
        <button onclick="logoutStudent()" class="text-xs px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-semibold">
          登出
        </button>
      </div>

      <!-- 待辦清單區 -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
            <span>📋</span> 待完成簽認課程
          </h3>
          <span id="pendingCountBadge" class="text-xs px-2 py-0.5 rounded-full font-bold bg-amber-100 text-amber-800">
            0 門待簽
          </span>
        </div>

        <div id="pendingListContainer" class="space-y-3 pt-1">
          <div class="text-center py-6 text-slate-400 text-xs">正在載入待簽核清單...</div>
        </div>
      </div>

    </div>

    <!-- 3. 單一課程簽核視窗 -->
    <div id="signModalView" class="hidden bg-white rounded-2xl shadow-xl p-5 space-y-5 border border-slate-200">
      
      <div class="flex justify-between items-center border-b pb-3">
        <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-full" id="detailCategory">宣導/告知/訓練</span>
        <button onclick="closeSignModalView()" class="text-xs text-slate-400 hover:text-slate-600 font-bold">✕ 返回清單</button>
      </div>

      <h2 class="text-xl font-bold text-slate-800 leading-snug" id="detailTitle">--</h2>

      <!-- 宣導重點 -->
      <div class="bg-amber-50 border-2 border-amber-300 rounded-xl p-4 text-slate-800 space-y-2">
        <p class="font-bold text-amber-950 text-base flex items-center gap-1.5 border-b border-amber-200 pb-2">
          <span class="text-xl">⚠️</span> 宣導/告知/訓練 重點項目：
        </p>
        <div id="detailContent" class="whitespace-pre-line leading-relaxed text-base font-medium text-slate-900 break-words">
          載入中...
        </div>
      </div>

      <!-- 教材圖片 -->
      <div id="detailImageGallery" class="hidden space-y-2 pt-1">
        <p class="text-xs font-bold text-slate-700">🖼️ 說明圖示與規範照片 (點擊看大圖)：</p>
        <div id="detailImageList" class="space-y-3"></div>
      </div>

      <!-- 簽名表單 -->
      <form id="signForm" class="space-y-4 pt-2 border-t">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">簽核人員</label>
          <div class="p-2.5 bg-slate-50 rounded-xl text-sm font-bold text-slate-700 border" id="signerDisplay">--</div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">本人親筆手寫簽名 <span class="text-red-500">*</span></label>
          <button type="button" id="openSigCanvasBtn" class="w-full py-3.5 border-2 border-dashed border-blue-500 bg-blue-50 text-blue-700 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-blue-100">
            <span>✍️</span> 點此開啟【直式手寫簽名板】
          </button>
          <div id="signedPreviewBox" class="hidden border-2 border-emerald-300 rounded-xl p-2 bg-emerald-50/50 flex items-center justify-between">
            <span class="text-emerald-600 font-bold text-xs">✓ 已完成手寫簽名</span>
            <img id="sigPreviewImg" class="h-10 max-w-[150px] object-contain border bg-white rounded p-0.5" />
            <button type="button" id="reSignBtn" class="text-xs text-blue-600 underline font-bold">重簽</button>
          </div>
        </div>

        <div class="pt-1">
          <label class="flex items-start gap-2 cursor-pointer">
            <input id="agreeCheck" type="checkbox" required class="h-4 w-4 mt-0.5 text-blue-600 rounded border-slate-300">
            <span class="text-xs text-slate-700 font-medium leading-tight">我已確實閱讀並完整理解上述宣導條目，承諾落實執行。</span>
          </label>
        </div>

        <button type="submit" id="submitSignBtn" disabled class="w-full bg-slate-300 text-slate-500 font-bold py-3.5 rounded-xl text-sm transition cursor-not-allowed">
          請完成簽名與勾選承諾
        </button>
      </form>

    </div>

  </div>

  <!-- 直式大簽名板 Modal -->
  <div id="sigCanvasModal" class="fixed inset-0 bg-black/75 z-50 hidden flex flex-col justify-center items-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 flex flex-col space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <span class="font-bold text-slate-800 text-sm">請以手指書寫您的簽名</span>
        <button type="button" id="modalClearBtn" class="text-xs bg-red-50 text-red-600 border border-red-200 px-2.5 py-1 rounded font-bold">清除重寫</button>
      </div>

      <div class="border-2 border-slate-300 rounded-xl bg-white overflow-hidden shadow-inner relative">
        <canvas id="modalSigCanvas" width="600" height="340" class="w-full h-52 bg-white sig-guide-line"></canvas>
        <span class="absolute bottom-2 left-3 pointer-events-none text-[11px] text-slate-300">請在此區域內水平書寫</span>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <button type="button" id="modalCancelBtn" class="py-2.5 bg-slate-200 text-slate-700 rounded-xl text-sm font-bold">取消</button>
        <button type="button" id="modalSaveBtn" class="py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold shadow">保存簽名</button>
      </div>
    </div>
  </div>

  <!-- 照片放大燈箱 -->
  <div id="imageLightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-center items-center p-2" onclick="this.classList.add('hidden')">
    <img id="lightboxImg" class="max-w-full max-h-[85vh] object-contain rounded-lg" />
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyGT6xpXAsads6FAzH8bmh9fQeJ69PNT2pkN6lq3Ceth1YhX9z_gct7RLN6qBy4udRk/exec";
    const STUDENT_SESSION_KEY = "trainingPlatformStudentId";

    let currentStudent = null;
    let activeCourseFileId = null;
    let savedSignatureBase64 = "";

    function openStudentPortal(data) {
      currentStudent = { empId: data.empId, name: data.name };
      document.getElementById("welcomeName").innerText = currentStudent.name;
      document.getElementById("displayEmpId").innerText = currentStudent.empId;
      document.getElementById("studentLoginBox").classList.add("hidden");
      document.getElementById("studentPortal").classList.remove("hidden");
      renderPendingList(data.pendingCourses || []);
    }

    async function handleStudentLogin() {
      const empId = document.getElementById("loginEmpId").value.trim();
      if (!empId) return alert("請輸入工號！");

      const btn = document.getElementById("studentLoginBtn");
      btn.disabled = true;
      btn.innerText = "查詢待辦中...";

      try {
        const res = await fetch(`${GAS_URL}?action=getStudentPendingCourses&empId=${encodeURIComponent(empId)}`);
        const data = await res.json();
        if (data.status === "success") {
          // 只輸出到瀏覽器主控台，便於確認目前 /exec 是否已部署新版，以及哪一筆課程被略過。
          console.info("待簽課程診斷", data.debugLogs || []);
          localStorage.setItem(STUDENT_SESSION_KEY, data.empId);
          openStudentPortal(data);
        } else {
          alert("查無此工號或連線異常！");
        }
      } catch (err) {
        alert("查詢失敗，請檢查手機網路！");
      } finally {
        btn.disabled = false;
        btn.innerText = "查詢我的待完成課程";
      }
    }

    function logoutStudent() {
      currentStudent = null;
      localStorage.removeItem(STUDENT_SESSION_KEY);
      document.getElementById("studentPortal").classList.add("hidden");
      document.getElementById("signModalView").classList.add("hidden");
      document.getElementById("studentLoginBox").classList.remove("hidden");
      document.getElementById("loginEmpId").value = "";
    }

    async function restoreStudentSession() {
      const savedId = localStorage.getItem(STUDENT_SESSION_KEY);
      if (!savedId) return;

      document.getElementById("loginEmpId").value = savedId;
      try {
        const res = await fetch(`${GAS_URL}?action=getStudentPendingCourses&empId=${encodeURIComponent(savedId)}`);
        const data = await res.json();
        if (data.status === "success") {
          openStudentPortal(data);
        } else {
          localStorage.removeItem(STUDENT_SESSION_KEY);
        }
      } catch (err) {
        // 網路暫時中斷時保留記憶；使用者可重整或手動再次登入。
      }
    }

    document.addEventListener("DOMContentLoaded", restoreStudentSession);

    function renderPendingList(courses) {
      const container = document.getElementById("pendingListContainer");
      const badge = document.getElementById("pendingCountBadge");
      badge.innerText = `${courses.length} 門待簽`;

      if (courses.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 space-y-2">
            <div class="text-emerald-500 text-5xl font-bold">✓</div>
            <h3 class="text-base font-bold text-slate-800">目前無待簽核課程！</h3>
            <p class="text-xs text-slate-400">您名下所有的教育訓練皆已完成簽認。</p>
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      courses.forEach(c => {
        const card = document.createElement("div");
        card.className = "p-4 border border-amber-200 bg-amber-50/60 rounded-xl space-y-2 hover:bg-amber-100/60 transition cursor-pointer";
        card.onclick = () => openSignCourse(c.fileId);
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="text-xs bg-amber-200 text-amber-900 font-bold px-2 py-0.5 rounded">${c.category}</span>
            <span class="text-xs font-bold text-blue-600">點此簽署 ➔</span>
          </div>
          <h4 class="font-bold text-slate-800 text-base leading-snug">${c.title}</h4>
          <p class="text-[11px] text-slate-500">經辦：${c.creator} ｜ 建立時間：${c.createdAt}</p>
        `;
        container.appendChild(card);
      });
    }

    async function openSignCourse(fileId) {
      activeCourseFileId = fileId;
      document.getElementById("studentPortal").classList.add("hidden");
      document.getElementById("signModalView").classList.remove("hidden");
      document.getElementById("signerDisplay").innerText = `[${currentStudent.empId}] ${currentStudent.name}`;
      document.getElementById("detailTitle").innerText = "載入訓練內容中...";
      document.getElementById("detailContent").innerText = "正在從雲端載入重點條目...";

      savedSignatureBase64 = "";
      document.getElementById("openSigCanvasBtn").classList.remove("hidden");
      document.getElementById("signedPreviewBox").classList.add("hidden");
      document.getElementById("agreeCheck").checked = false;
      validateSignForm();

      try {
        const res = await fetch(`${GAS_URL}?action=getCourseDetail&fileId=${fileId}`);
        const data = await res.json();
        if (data.status === "success") {
          document.getElementById("detailTitle").innerText = data.info.title;
          document.getElementById("detailCategory").innerText = data.info.category;
          document.getElementById("detailContent").innerText = data.info.content;

          const gal = document.getElementById("detailImageGallery");
          const list = document.getElementById("detailImageList");
          if (data.info.images && data.info.images.length > 0) {
            gal.classList.remove("hidden");
            list.innerHTML = "";
            data.info.images.forEach(img => {
              const item = document.createElement("div");
              item.className = "border rounded-xl overflow-hidden bg-slate-50";
              item.innerHTML = `
                <img src="${img.url}" class="w-full h-auto max-h-60 object-contain bg-white cursor-pointer" onclick="openLightbox('${img.url}')" />
                ${img.note ? `<p class="p-2 text-xs text-slate-700 bg-slate-50 border-t">${img.note}</p>` : ''}
              `;
              list.appendChild(item);
            });
          } else {
            gal.classList.add("hidden");
          }
        }
      } catch (err) {
        document.getElementById("detailContent").innerText = "無法載入課程資訊，請檢查網路連線。";
      }
    }

    function closeSignModalView() {
      document.getElementById("signModalView").classList.add("hidden");
      document.getElementById("studentPortal").classList.remove("hidden");
      refreshStudentPending();
    }

    async function refreshStudentPending() {
      try {
        const res = await fetch(`${GAS_URL}?action=getStudentPendingCourses&empId=${encodeURIComponent(currentStudent.empId)}`);
        const data = await res.json();
        if (data.status === "success") {
          renderPendingList(data.pendingCourses);
        }
      } catch (e) {}
    }

    function openLightbox(url) {
      document.getElementById("lightboxImg").src = url;
      document.getElementById("imageLightbox").classList.remove("hidden");
    }

    const sigModal = document.getElementById("sigCanvasModal");
    const canvas = document.getElementById("modalSigCanvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false, hasDrawn = false;

    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3.5;
    ctx.lineCap = "round";

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (cx - rect.left) * (canvas.width / rect.width),
        y: (cy - rect.top) * (canvas.height / rect.height)
      };
    }

    function start(e) { isDrawing = true; hasDrawn = true; const p = getCanvasPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
    function move(e) { if (!isDrawing) return; const p = getCanvasPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
    function end() { isDrawing = false; }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); start(e); }, { passive: false });
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); move(e); }, { passive: false });
    window.addEventListener("touchend", end);

    document.getElementById("openSigCanvasBtn").onclick = () => sigModal.classList.remove("hidden");
    document.getElementById("reSignBtn").onclick = () => sigModal.classList.remove("hidden");
    document.getElementById("modalCancelBtn").onclick = () => sigModal.classList.add("hidden");

    document.getElementById("modalClearBtn").onclick = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hasDrawn = false;
    };

    document.getElementById("modalSaveBtn").onclick = () => {
      if (!hasDrawn) return alert("請書寫您的簽名！");
      savedSignatureBase64 = canvas.toDataURL("image/png");
      document.getElementById("sigPreviewImg").src = savedSignatureBase64;
      document.getElementById("openSigCanvasBtn").classList.add("hidden");
      document.getElementById("signedPreviewBox").classList.remove("hidden");
      sigModal.classList.add("hidden");
      validateSignForm();
    };

    document.getElementById("agreeCheck").onchange = validateSignForm;

    function validateSignForm() {
      const agree = document.getElementById("agreeCheck").checked;
      const btn = document.getElementById("submitSignBtn");
      if (agree && savedSignatureBase64) {
        btn.disabled = false;
        btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm transition shadow cursor-pointer";
        btn.innerText = "確認閱讀完成並送出簽認";
      } else {
        btn.disabled = true;
        btn.className = "w-full bg-slate-300 text-slate-500 font-bold py-3.5 rounded-xl text-sm transition cursor-not-allowed";
        btn.innerText = "請完成簽名與勾選承諾";
      }
    }

    document.getElementById("signForm").onsubmit = async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitSignBtn");
      btn.disabled = true;
      btn.innerText = "存檔中...";

      const payload = {
        action: "submitSign",
        fileId: activeCourseFileId,
        empId: currentStudent.empId,
        name: currentStudent.name,
        signature: savedSignatureBase64
      };

      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        alert("簽核成功！已為您從待辦清單中移除。");
        closeSignModalView();
      } catch (err) {
        alert("送出異常，請檢查手機網路！");
        validateSignForm();
      }
    };
  </script>
</body>
</html>
